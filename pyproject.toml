[project]
name = "dvf-herault-immobilier"
version = "1.0.0"
description = "Marché immobilier de l'Hérault (34) à partir des Demandes de valeurs foncières : nettoyage DuckDB, indicateurs, modèle Power BI et démo Streamlit."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Yasmina Saoud" }]
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "altair>=5.4",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
